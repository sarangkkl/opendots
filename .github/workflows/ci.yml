name: Validate and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf libvpx-dev libclang-dev
      - name: macOS codec prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install libvpx pkg-config llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Windows codec prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libvpx:x64-windows-static-md
          $lib = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows-static-md/lib'
          if (-not (Test-Path "$lib/libvpx.lib")) { Copy-Item "$lib/vpx.lib" "$lib/libvpx.lib" }
          "VPX_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "VPX_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/include" >> $env:GITHUB_ENV
          "VPX_VERSION=1.15.2" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Native browser fixture
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked browser_fixture -- --ignored --nocapture
      - name: Browser workflow tests
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: bash scripts/install-from-source.sh --build-only
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: ./scripts/install-from-source.ps1 -BuildOnly
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/install-from-source.sh --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: opendots-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
